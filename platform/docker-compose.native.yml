# Native Docker-based execution. Backend spawns short-lived sibling
# containers on the host Docker daemon (per-test-case sandbox). No Judge0
# services, no external API. Works on macOS, Linux, and WSL2.
#
# Usage (from repo root):
#   docker compose -f platform/docker-compose.native.yml up -d --build
#   open http://localhost:3000

services:
  platform-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    volumes:
      - platform_db:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: always

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://platform:platform@platform-db:5432/platform?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      CORS_ORIGIN: http://localhost:3000
      PORT: "4000"
      NODE_ENV: development
      SANDBOX_VOLUME: platform_sub
      SANDBOX_MOUNT: /sub
      EXEC_PARALLELISM: "4"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - platform_sub:/sub
    depends_on:
      - platform-db
    ports:
      - "4000:4000"
    restart: always

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_URL: http://backend:4000
    depends_on:
      - backend
    ports:
      - "3000:3000"
    restart: always

volumes:
  platform_db:
  platform_sub:
    name: platform_sub

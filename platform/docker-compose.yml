services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    volumes:
      - platform_db:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: always

  backend:
    build:
      context: ./platform/backend
    env_file:
      - ./platform/backend/.env
    environment:
      DATABASE_URL: postgresql://platform:platform@db:5432/platform?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      JUDGE0_URL: http://server:2358
      JUDGE0_CALLBACK_SECRET: ${JUDGE0_CALLBACK_SECRET:-change-me-shared-secret}
      PUBLIC_BACKEND_URL: http://backend:4000
      CORS_ORIGIN: http://localhost:3000
      PORT: "4000"
      NODE_ENV: development
    depends_on:
      - db
      - server
    ports:
      - "4000:4000"
    restart: always

  frontend:
    build:
      context: ./platform/frontend
    environment:
      BACKEND_URL: http://backend:4000
    depends_on:
      - backend
    ports:
      - "3000:3000"
    restart: always

volumes:
  platform_db:
